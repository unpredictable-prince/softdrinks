<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Masala Chaas Creamy Buttermilk Gradient -->
    <linearGradient id="chaasMilk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#d1fae5" stop-opacity="1" />
      <stop offset="70%" stop-color="#f0fdf4" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlowChaas">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cooling Ambient Glow -->
  <circle cx="200" cy="380" r="160" fill="url(#mintGlow)" opacity="0.35" filter="url(#softGlowChaas)" />

  <!-- Bottle Cap (Earthen Terracotta Style) -->
  <rect x="175" y="45" width="50" height="25" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2" />
  <rect x="172" y="70" width="56" height="8" rx="2" fill="#166534" />

  <!-- Bottle Neck -->
  <path d="M180,78 C180,120 160,170 145,210 L255,210 C240,170 220,120 220,78 Z" fill="url(#chaasMilk)" stroke="#a7f3d0" stroke-width="1.5" />

  <!-- Bottle Body -->
  <rect x="135" y="210" width="130" height="390" rx="24" fill="url(#chaasMilk)" stroke="#6ee7b7" stroke-width="1.5" />
  <!-- Bottle Base Curve -->
  <path d="M135,580 Q200,620 265,580 L265,600 Q200,630 135,600 Z" fill="#047857" opacity="0.7" />

  <!-- Highlighting Specular Reflections -->
  <path d="M150,225 Q145,380 150,560" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.65" fill="none" />
  <path d="M163,235 Q158,350 163,500" stroke="#f0fdf4" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none" />

  <!-- Roasted Cumin & Mint Flecks -->
  <circle cx="165" cy="460" r="2.5" fill="#78350f" opacity="0.8" />
  <circle cx="185" cy="510" r="2" fill="#166534" opacity="0.75" />
  <circle cx="215" cy="480" r="2.5" fill="#78350f" opacity="0.8" />
  <circle cx="230" cy="420" r="2" fill="#15803d" opacity="0.7" />
  <circle cx="190" cy="370" r="3" fill="#78350f" opacity="0.8" />
  <circle cx="170" cy="310" r="2" fill="#15803d" opacity="0.75" />
  <circle cx="225" cy="270" r="2.5" fill="#78350f" opacity="0.7" />
  <circle cx="205" cy="540" r="2" fill="#166534" opacity="0.7" />

  <!-- Brand Label Badge -->
  <g transform="translate(142, 330)">
    <rect x="0" y="0" width="116" height="150" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="3" />
    <rect x="6" y="6" width="104" height="138" rx="8" fill="#022c22" />
    <text x="58" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#34d399" text-anchor="middle" letter-spacing="1">FIZZORA</text>
    <line x1="20" y1="42" x2="96" y2="42" stroke="#059669" stroke-width="1.5" />
    <text x="58" y="64" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">MASALA</text>
    <text x="58" y="83" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#a7f3d0" text-anchor="middle">CHAAS</text>
    <text x="58" y="103" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8.5" fill="#6ee7b7" text-anchor="middle">SLOW CHURNED DAHI</text>
    <rect x="16" y="116" width="84" height="18" rx="4" fill="#059669" />
    <text x="58" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">KATHIYAWADI DESI</text>
  </g>
</svg>
