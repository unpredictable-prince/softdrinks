<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Bottle Glass Gradient -->
    <linearGradient id="glassJ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.95" />
    </linearGradient>
    <!-- Effervescence Bubbles Glow -->
    <radialGradient id="bubbleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambience Glow -->
  <circle cx="200" cy="380" r="160" fill="url(#bubbleGlow)" opacity="0.4" filter="url(#softGlow)" />

  <!-- Bottle Cap -->
  <rect x="175" y="45" width="50" height="25" rx="4" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
  <rect x="172" y="70" width="56" height="8" rx="2" fill="#d97706" />

  <!-- Bottle Neck -->
  <path d="M180,78 C180,120 160,170 145,210 L255,210 C240,170 220,120 220,78 Z" fill="url(#glassJ)" />

  <!-- Bottle Body -->
  <rect x="135" y="210" width="130" height="390" rx="24" fill="url(#glassJ)" />
  <!-- Bottle Base Curve -->
  <path d="M135,580 Q200,620 265,580 L265,600 Q200,630 135,600 Z" fill="#78350f" opacity="0.8" />

  <!-- Highlighting Specular Reflections -->
  <path d="M150,225 Q145,380 150,560" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" opacity="0.45" fill="none" />
  <path d="M162,235 Q158,350 162,500" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />

  <!-- Soft Drink Effervescent Carbonation Bubbles -->
  <circle cx="165" cy="460" r="4.5" fill="#fef08a" opacity="0.75" />
  <circle cx="185" cy="510" r="3" fill="#fef08a" opacity="0.6" />
  <circle cx="215" cy="480" r="5" fill="#fef08a" opacity="0.8" />
  <circle cx="230" cy="420" r="3.5" fill="#fef08a" opacity="0.7" />
  <circle cx="190" cy="370" r="4" fill="#fef08a" opacity="0.85" />
  <circle cx="170" cy="310" r="3" fill="#fef08a" opacity="0.6" />
  <circle cx="220" cy="270" r="4" fill="#fef08a" opacity="0.7" />

  <!-- Brand Label Badge -->
  <g transform="translate(142, 330)">
    <rect x="0" y="0" width="116" height="150" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="3" />
    <rect x="6" y="6" width="104" height="138" rx="8" fill="#27272a" />
    <text x="58" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#f59e0b" text-anchor="middle" letter-spacing="1">FIZZORA</text>
    <line x1="20" y1="42" x2="96" y2="42" stroke="#d97706" stroke-width="1.5" />
    <text x="58" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">JEERA</text>
    <text x="58" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#fbbf24" text-anchor="middle">MASALA</text>
    <text x="58" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9" fill="#a1a1aa" text-anchor="middle">DIGESTIVE FIZZ</text>
    <rect x="18" y="118" width="80" height="18" rx="4" fill="#d97706" />
    <text x="58" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle">GUJARAT PRIDE</text>
  </g>
</svg>
