<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Kesar Pista Saffron Milk Gradient -->
    <linearGradient id="kesarMilk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#fef9c3" stop-opacity="1" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="kesarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlowKesar">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Saffron Glow -->
  <circle cx="200" cy="380" r="160" fill="url(#kesarGlow)" opacity="0.4" filter="url(#softGlowKesar)" />

  <!-- Bottle Cap -->
  <rect x="175" y="45" width="50" height="25" rx="4" fill="#ca8a04" stroke="#713f12" stroke-width="2" />
  <rect x="172" y="70" width="56" height="8" rx="2" fill="#a16207" />

  <!-- Bottle Neck -->
  <path d="M180,78 C180,120 160,170 145,210 L255,210 C240,170 220,120 220,78 Z" fill="url(#kesarMilk)" stroke="#facc15" stroke-width="1.5" />

  <!-- Bottle Body -->
  <rect x="135" y="210" width="130" height="390" rx="24" fill="url(#kesarMilk)" stroke="#eab308" stroke-width="1.5" />
  <!-- Bottle Base Curve -->
  <path d="M135,580 Q200,620 265,580 L265,600 Q200,630 135,600 Z" fill="#854d0e" opacity="0.7" />

  <!-- Highlighting Specular Reflections -->
  <path d="M150,225 Q145,380 150,560" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.7" fill="none" />
  <path d="M163,235 Q158,350 163,500" stroke="#fef9c3" stroke-width="4" stroke-linecap="round" opacity="0.55" fill="none" />

  <!-- Emerald Pista Slivers & Red Saffron Strands -->
  <!-- Pista flakes -->
  <ellipse cx="165" cy="460" rx="3.5" ry="2" fill="#15803d" opacity="0.85" />
  <ellipse cx="185" cy="510" rx="3" ry="1.8" fill="#16a34a" opacity="0.8" />
  <ellipse cx="215" cy="480" rx="3.5" ry="2" fill="#15803d" opacity="0.85" />
  <ellipse cx="230" cy="420" rx="3" ry="1.8" fill="#16a34a" opacity="0.8" />
  <ellipse cx="190" cy="370" rx="4" ry="2" fill="#15803d" opacity="0.85" />
  <!-- Saffron threads -->
  <path d="M172,305 Q176,315 174,325" stroke="#b91c1c" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round" />
  <path d="M220,265 Q225,275 222,285" stroke="#b91c1c" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round" />
  <path d="M198,440 Q202,450 199,460" stroke="#b91c1c" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round" />
  <path d="M160,540 Q164,550 162,558" stroke="#b91c1c" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round" />

  <!-- Brand Label Badge -->
  <g transform="translate(142, 330)">
    <rect x="0" y="0" width="116" height="150" rx="10" fill="#422006" stroke="#eab308" stroke-width="3" />
    <rect x="6" y="6" width="104" height="138" rx="8" fill="#1c0c02" />
    <text x="58" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#fde047" text-anchor="middle" letter-spacing="1">FIZZORA</text>
    <line x1="20" y1="42" x2="96" y2="42" stroke="#ca8a04" stroke-width="1.5" />
    <text x="58" y="64" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">KESAR PISTA</text>
    <text x="58" y="83" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#facc15" text-anchor="middle">FLAVOURED MILK</text>
    <text x="58" y="103" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8.5" fill="#fef08a" text-anchor="middle">REAL SAFFRON STRANDS</text>
    <rect x="16" y="116" width="84" height="18" rx="4" fill="#ca8a04" />
    <text x="58" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">CELEBRATION SIP</text>
  </g>
</svg>
